project_id = "get-fit"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["getfit://auth-callback"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.invite-client]
verify_jwt = true

[functions.delete-client]
verify_jwt = true